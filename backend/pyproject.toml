[project]
name = "property-focus"
version = "0.1.0"
description = "Property Focus backend: API, MCP adapter, scheduled tasks and workers (one modular monolith)."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20,<2",
    "boto3>=1.43,<2",
    "fastapi>=0.162,<1",
    "mcp>=2.3,<2.4",
    "opentelemetry-api==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.14,<3",
    "pyjwt[crypto]>=2.15.1,<3",
    "sqlalchemy>=2.1,<3",
    "uvicorn==0.54.0",
]

[project.scripts]
property-focus = "property_focus.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "property_focus"
